name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 18123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: mvcheck
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget -qO- http://default:mvcheck@localhost:8123/?query=SELECT%201 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test
        env:
          CLICKHOUSE_MV_CHECK_TEST_URL: http://localhost:18123
          CLICKHOUSE_MV_CHECK_TEST_USER: default
          CLICKHOUSE_MV_CHECK_TEST_PASSWORD: mvcheck
        run: python -m pytest -q

      - name: Type check
        run: python -m mypy src --strict
